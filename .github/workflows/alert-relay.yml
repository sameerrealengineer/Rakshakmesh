name: Alert relay (SACHET -> alerts-data branch)

# Every 30 minutes: read NDMA SACHET CAP alerts, keep Odisha, and write one small JSON file per
# district to the `alerts-data` branch. The app downloads
#   https://raw.githubusercontent.com/<owner>/<repo>/alerts-data/alerts/<District>.json
# No GitHub Pages or other setup needed. Scheduled runs happen only on the default branch.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: alert-relay
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        working-directory: relay
        run: python -m unittest
      - name: Check out previous data
        run: |
          if git ls-remote --exit-code --heads origin alerts-data >/dev/null 2>&1; then
            git fetch --depth 1 origin alerts-data
            mkdir data && git --work-tree=data checkout origin/alerts-data -- . && git reset -q
          else
            mkdir data
          fi
      - name: Fetch SACHET and build district files
        # Optional repo variable SACHET_FEEDS: space-separated RSS URLs to use instead of the default.
        env:
          SACHET_FEEDS: ${{ vars.SACHET_FEEDS }}
        run: python relay/fetch_sachet.py --out data
      - name: Publish to alerts-data branch
        working-directory: data
        run: |
          # One commit only (orphan), so the branch stays tiny no matter how often this runs.
          rm -rf .git
          git init -q -b alerts-data
          git config user.name "rakshakmesh-relay"
          git config user.email "relay@users.noreply.github.com"
          git add -A
          git commit -q -m "Alerts $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:alerts-data
